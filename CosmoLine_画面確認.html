esult,.audit-item{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}\nsection form,article form{background:#172a49}.employee-row{display:flex;flex-wrap:wrap;gap:12px}.employee-cell{color:var(--text)}.employee-retired{opacity:.75}.audit-list{padding:0;list-style:none}fieldset{border:0;min-width:0;padding:0}\ninput,select,textarea,button{font:inherit;max-width:100%;min-width:0;padding:10px 12px;border-radius:8px;box-sizing:border-box}input,textarea,.field-input,.field-select,select{background:#0c192e;color:var(--text);border:1px solid #647b9f}input,textarea{width:100%}input[type=checkbox],input[type=radio]{width:auto}label,.field-label{display:block;margin:12px 0 6px;color:var(--text)}textarea{min-height:110px}\nbutton,.submit-button{cursor:pointer;background:var(--blue);color:white;border:1px solid #6b91c8;font-weight:700;min-height:44px}.ui-form button{margin-top:12px}button:disabled{cursor:default;opacity:.65;filter:none}form[action*=\"logout\"] button,form[action*=\"retire\"] button{background:var(--red);border-color:#d48893}form[action*=\"shifts\"] button,form[action*=\"attendance\"] button{background:var(--teal);border-color:#58a599}\n.alert-region{color:var(--muted);background:#12223d;border:1px solid #547098;padding:12px;border-radius:10px}.alert-active,[role=alert]{color:#ffd0d7}.alert-active{background:#3c2034;border-color:#b97989}code,pre{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}\ntd,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}table{width:100%;border-collapse:collapse}.table-scroll{overflow-x:auto}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.menu-grid a{display:flex;flex-direction:column;gap:6px;padding:20px;min-height:110px}.menu-grid small{font-weight:400;line-height:1.5;color:#fff}.menu-heading{margin-top:30px}.home-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.home-summary section{margin:0}\n.month-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px}.month-toolbar label{flex:1;min-width:180px;margin:0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 0}.calendar-weekday{text-align:center;color:var(--muted);font-weight:700}.calendar-day{border:1px solid var(--line);border-radius:9px;min-height:128px;padding:8px;background:#10203a;overflow-wrap:anywhere;min-width:0}.calendar-day.empty{background:transparent;border-color:transparent}.calendar-day strong{display:block}.calendar-day.sunday strong{color:#ffb4c6}.calendar-day.saturday strong{color:#a3caff}.calendar-item{display:block;background:#1e4b50;color:#e2fff8;border-left:3px solid #79d9c4;border-radius:4px;padding:4px;margin:5px 0;font-size:.8rem;line-height:1.5}.calendar-item.company{background:#34416b;border-color:#b0b6ff}.calendar-item.returned{background:#563346;border-color:#eeafc2}.shift-state{display:inline-block;font-size:.85rem;font-weight:700;border-radius:5px;padding:2px 7px;background:#234d56;color:#d5fff5}.shift-input-row{display:grid;grid-template-columns:110px 1fr 1fr 2fr;gap:10px;border-top:1px solid var(--line);padding:12px 0;align-items:center}.shift-input-row label{margin:0;font-size:.9rem}.shift-input-row input{padding:7px}.month-help{color:var(--muted)}details{margin:20px 0}summary{cursor:pointer;font-weight:700;color:#c9dcff}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem}.legend span{border-left:5px solid #7bdac5;padding-left:7px}.legend .company{border-color:#b0b6ff}\n@media(max-width:600px){main,.site-main{padding:14px}h1{font-size:1.5rem}nav{gap:7px}nav a{padding:8px 10px;font-size:.9rem}.menu-grid{grid-template-columns:1fr}.calendar{gap:3px}.calendar-day{padding:4px;min-height:105px;font-size:.85rem}.calendar-item{font-size:.65rem;padding:2px;border-left-width:2px}.shift-input-row{grid-template-columns:1fr 1fr}.shift-input-row strong,.shift-input-row label:last-child{grid-column:1/ 14px}h1{font-size:1.5rem}nav{gap:7px}nav a{padding:8px 10px;font-size:.9rem}.menu-grid{grid-template-columns:1fr}.calendar{gap:3px}.calendar-day{padding:4px;min-height:105px;font-size:.85rem}.calendar-item{font-size:.65rem;padding:2px;border-left-width:2px}.shift-input-row{grid-template-columns:1fr 1fr}.shift-input-row strong,.shift-input-row label:last-child{grid-column:1/-1}section,article,form,.ui-form{padding:13px}input,select{width:100%}input[type=checkbox]{width:auto}.employee-row{display:block}.employee-cell{max-width:100%;overflow-wrap:anywhere}}\n\n.preset-choices{display:flex;flex-wrap:wrap;gap:8px}.preset-choice{background:#163d57}.preset-choice small{display:block;font-weight:400}.preset-choice[aria-pressed=true],#clear-shift-choice[aria-pressed=true]{outline:3px solid #ffe19c;background:#2b635f}.calendar-pick{display:block;width:100%;padding:2px;min-height:38px;background:#213e65;border:1px solid #6c8eb9}.calendar-pick[aria-pressed=true]{background:#226855;outline:2px solid #a2eed7}.calendar-draft{display:block;font-size:.75rem;background:#315045;color:#fff;overflow-wrap:anywhere}.calendar-pick:disabled{opacity:.6}.calendar-item{word-break:normal}nav a[href^=\"/suggestions\"]{background:#654494;border-color:#a48acb}\n@media(max-width:600px){.calendar-day{padding:2px}.calendar-item{padding:1px;font-size:.62rem}.calendar-pick{font-size:.8rem;padding:0}.calendar-draft{font-size:.62rem}}\n\n.global-nav{padding:12px 0;border-bottom:1px solid #354968;margin-bottom:24px}.global-nav a{font-size:.85rem;padding:7px 10px}.feature-group{background:transparent;border:0;padding:0;margin:26px 0}.feature-group h2{margin-bottom:10px}.feature-group .menu-grid{margin-top:0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"site-header\">\n    \u003cp class=\"site-title\">コスモライン｜社員ポータル\u003c/p>\n  \u003c/header>\n  \u003cmain class=\"site-main\">\n    \u003cnav class=\"global-nav\" aria-label=\"全機能メニュー\">\u003ca href=\"/home\">ホーム\u003c/a>\u003ca href=\"/news\">会社のお知らせ\u003c/a>\u003ca href=\"/notifications\">個人宛通知\u003c/a>\u003ca href=\"/posts\">週報・学習の振り返り\u003c/a>\u003ca href=\"/schedule\">シフト・カレンダー\u003c/a>\u003ca href=\"/attendance\">勤怠・休暇\u003c/a>\u003ca href=\"/learning\">学習・ランキング\u003c/a>\u003ca href=\"/development\">育成・面談\u003c/a>\u003ca href=\"/suggestions\">目安箱\u003c/a>\u003ca href=\"/payroll\">勤怠集計・給与試算\u003c/a>\u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003ca href=\"/admin/audit\">操作履歴\u003c/a>\u003ca href=\"/settings\">基準・担当範囲\u003c/a>\u003ca href=\"/operations\">バックアップ・運用\u003c/a>\u003ca href=\"/security/totp\">二段階認証の設定\u003c/a>\u003c/nav>\n    \n\u003ch1 class=\"page-heading\">社員管理\u003c/h1>\u003cp>\u003ca href=\"/admin/security-reset\">パスワード・認証アプリをリセットする\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"/dispatch/companies\">派遣先会社・締日設定\u003c/a> / \u003ca href=\"/company-sharing\">会社別共有・勤怠締め\u003c/a>\u003c/p>\u003cdiv class=\"employee-table\">\n  \n  \u003cdiv class=\"employee-row \">\n    \u003cp class=\"employee-cell\">社員番号：\u003ccode>preview-admin\u003c/code>\u003c/p>\n    \u003cp class=\"employee-cell\">登録日時：2026年10月30日 20:22:13（日本時間）\u003c/p>\n    \u003cp class=\"employee-cell\">表示名:画面確認用管理者\u003c/p>\n    \u003cp class=\"employee-cell\">社員区分：未設定\u003c/p>\n    \u003cp class=\"employee-cell\">状態:在籍中\u003c/p>\n    \u003cp class=\"employee-cell\">育成：未設定 / 未設定\u003c/p>\n    \u003cp class=\"employee-cell\">育成担当者：未設定\u003c/p>\n    \u003cp class=\"employee-cell\">役割：\n      \u003cspan class=\"employee-cell\">管理者\u003c/span>\n      \n    \u003c/p>\n  \u003c/div>\n  \n\u003c/div>\n\n\u003cform class=\"ui-form\" id=\"employee-create-form\" action=\"/api/admin/employees\" method=\"post\" enctype=\"application/x-www-form-urlencoded\">\n  \u003clabel class=\"field-label\" for=\"employee_id\">社員番号（必須）\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"employee_id\" value=\"\" required>\n  \u003clabel class=\"field-label\" for=\"display_name\">表示名（必須）\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"display_name\" value=\"\" required>\n  \u003clabel class=\"field-label\" for=\"password\">パスワード（必須）\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"password\" value=\"\" required>\n  \u003clabel class=\"field-label\" for=\"roles\">アクセス権限（管理者、一般社員、人事担当、給与労務担当から選んで読点で区切る）\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"roles\" value=\"\" required>\n\u003clabel>育成コース\u003cselect name=\"development_course\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"intensive\">短期集中（企画案3〜6か月）\u003c/option>\u003coption value=\"standard\">標準（企画案6か月〜1年）\u003c/option>\u003coption value=\"long\">長期（企画案1〜2年）\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>育成上の職位\u003cselect name=\"development_position\">\u003coption value=\"\">未設定\u003c/option>\u003coption>人事企画\u003c/option>\u003coption>人事メンター\u003c/option>\u003coption>人事採用\u003c/option>\u003coption>人事事務\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>育成担当者\u003cselect name=\"development_staff_id\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"preview-admin\">画面確認用管理者（preview-admin）\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>社員区分（ロール）\u003cselect name=\"employee_kind\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"internal\">派遣以外\u003c/option>\u003coption value=\"dispatch\">派遣社員\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>適用開始日\u003cinput class=\"dispatch-effective-date\" name=\"dispatch_effective_date\" type=\"date\" value=\"2026-10-30\">\u003c/label>\n\u003cfieldset class=\"dispatch-only\" hidden>\u003clegend>派遣社員の必須情報\u003c/legend>\n\u003clabel>派遣先会社\u003cselect name=\"dispatch_company_id\">\u003coption value=\"\">新しい会社を登録\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>新しい派遣先会社名\u003cinput name=\"dispatch_company_name\" maxlength=\"150\">\u003c/label>\n\u003clabel>勤務先（店舗・事業所など）\u003cinput name=\"dispatch_workplace\" maxlength=\"200\">\u003c/label>\n\u003clabel>派遣担当者ID\u003cselect name=\"dispatch_staff_id\">\u003coption value=\"\">選択してください\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>会社の締日\u003cselect name=\"dispatch_closing_day\">\u003coption value=\"\">締日を選択\u003c/option>\u003coption value=\"0\">月末\u003c/option>\u003coption value=\"1\">1日\u003c/option>\u003coption value=\"2\">2日\u003c/option>\u003coption value=\"3\">3日\u003c/option>\u003coption value=\"4\">4日\u003c/option>\u003coption value=\"5\">5日\u003c/option>\u003coption value=\"6\">6日\u003c/option>\u003coption value=\"7\">7日\u003c/option>\u003coption value=\"8\">8日\u003c/option>\u003coption value=\"9\">9日\u003c/option>\u003coption value=\"10\">10日\u003c/option>\u003coption value=\"11\">11日\u003c/option>\u003coption value=\"12\">12日\u003c/option>\u003coption value=\"13\">13日\u003c/option>\u003coption value=\"14\">14日\u003c/option>\u003coption value=\"15\">15日\u003c/option>\u003coption value=\"16\">16日\u003c/option>\u003coption value=\"17\">17日\u003c/option>\u003coption value=\"18\">18日\u003c/option>\u003coption value=\"19\">19日\u003c/option>\u003coption value=\"20\">20日\u003c/option>\u003coption value=\"21\">21日\u003c/option>\u003coption value=\"22\">22日\u003c/option>\u003coption value=\"23\">23日\u003c/option>\u003coption value=\"24\">24日\u003c/option>\u003coption value=\"25\">25日\u003c/option>\u003coption value=\"26\">26日\u003c/option>\u003coption value=\"27\">27日\u003c/option>\u003coption value=\"28\">28日\u003c/option>\u003coption value=\"29\">29日\u003c/option>\u003coption value=\"30\">30日\u003c/option>\u003c/select>\u003c/label>\n\u003cp>すべて必須です。締日は会社共通です。既存会社の締日変更は\u003ca href=\"/dispatch/companies\">会社設定\u003c/a>で適用開始月を指定してください。派遣担当者は育成担当者とは別です。\u003c/p>\u003c/fieldset>\n  \u003cbutton class=\"submit-button\" type=\"submit\">社員を登録\u003c/button>\n\u003c/form>\n\n\u003csection>\u003ch2>登録済み社員の育成設定\u003c/h2>\u003cp>育成コース・職位・担当者を変更できます。進捗や過去の記録は保持されます。アクセス権限とは別の設定です。\u003c/p>\n\u003cform class=\"ui-form\" id=\"employee-development-form\">\u003clabel>対象社員\u003cselect name=\"target_id\" required>\u003coption value=\"\">社員を選択\u003c/option>\u003coption value=\"preview-admin\">画面確認用管理者（preview-admin）\u003c/option>\u003c/select>\u003c/label>\u003clabel>育成コース\u003cselect name=\"development_course\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"intensive\">短期集中（企画案3〜6か月）\u003c/option>\u003coption value=\"standard\">標準（企画案6か月〜1年）\u003c/option>\u003coption value=\"long\">長期（企画案1〜2年）\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>育成上の職位\u003cselect name=\"development_position\">\u003coption value=\"\">未設定\u003c/option>\u003coption>人事企画\u003c/option>\u003coption>人事メンター\u003c/option>\u003coption>人事採用\u003c/option>\u003coption>人事事務\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>育成担当者\u003cselect name=\"development_staff_id\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"preview-admin\">画面確認用管理者（preview-admin）\u003c/option>\u003c/select>\u003c/label>\u003cbutton type=\"submit\">育成設定を保存\u003c/button>\u003c/form>\u003c/section>\n\u003csection>\u003ch2>派遣情報の変更\u003c/h2>\u003cp>最新設定（将来分を含む）を読み込みます。変更を適用する日を指定してください。同じ適用開始日の修正も変更履歴を保存します。社員区分・派遣先・勤務先・派遣担当者を変更できます。\u003c/p>\u003cform class=\"ui-form\" id=\"dispatch-edit-form\">\u003clabel>対象社員\u003cselect name=\"employee_id\" required>\u003coption value=\"\">社員を選択\u003c/option>\u003c/select>\u003c/label>\u003clabel>社員区分（ロール）\u003cselect name=\"employee_kind\">\u003coption value=\"\">未設定\u003c/option>\u003coption value=\"internal\">派遣以外\u003c/option>\u003coption value=\"dispatch\">派遣社員\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>適用開始日\u003cinput class=\"dispatch-effective-date\" name=\"dispatch_effective_date\" type=\"date\" value=\"2026-10-30\">\u003c/label>\n\u003cfieldset class=\"dispatch-only\" hidden>\u003clegend>派遣社員の必須情報\u003c/legend>\n\u003clabel>派遣先会社\u003cselect name=\"dispatch_company_id\">\u003coption value=\"\">新しい会社を登録\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>新しい派遣先会社名\u003cinput name=\"dispatch_company_name\" maxlength=\"150\">\u003c/label>\n\u003clabel>勤務先（店舗・事業所など）\u003cinput name=\"dispatch_workplace\" maxlength=\"200\">\u003c/label>\n\u003clabel>派遣担当者ID\u003cselect name=\"dispatch_staff_id\">\u003coption value=\"\">選択してください\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>会社の締日\u003cselect name=\"dispatch_closing_day\">\u003coption value=\"\">締日を選択\u003c/option>\u003coption value=\"0\">月末\u003c/option>\u003coption value=\"1\">1日\u003c/option>\u003coption value=\"2\">2日\u003c/option>\u003coption value=\"3\">3日\u003c/option>\u003coption value=\"4\">4日\u003c/option>\u003coption value=\"5\">5日\u003c/option>\u003coption value=\"6\">6日\u003c/option>\u003coption value=\"7\">7日\u003c/option>\u003coption value=\"8\">8日\u003c/option>\u003coption value=\"9\">9日\u003c/option>\u003coption value=\"10\">10日\u003c/option>\u003coption value=\"11\">11日\u003c/option>\u003coption value=\"12\">12日\u003c/option>\u003coption value=\"13\">13日\u003c/option>\u003coption value=\"14\">14日\u003c/option>\u003coption value=\"15\">15日\u003c/option>\u003coption value=\"16\">16日\u003c/option>\u003coption value=\"17\">17日\u003c/option>\u003coption value=\"18\">18日\u003c/option>\u003coption value=\"19\">19日\u003c/option>\u003coption value=\"20\">20日\u003c/option>\u003coption value=\"21\">21日\u003c/option>\u003coption value=\"22\">22日\u003c/option>\u003coption value=\"23\">23日\u003c/option>\u003coption value=\"24\">24日\u003c/option>\u003coption value=\"25\">25日\u003c/option>\u003coption value=\"26\">26日\u003c/option>\u003coption value=\"27\">27日\u003c/option>\u003coption value=\"28\">28日\u003c/option>\u003coption value=\"29\">29日\u003c/option>\u003coption value=\"30\">30日\u003c/option>\u003c/select>\u003c/label>\n\u003cp>すべて必須です。締日は会社共通です。既存会社の締日変更は\u003ca href=\"/dispatch/companies\">会社設定\u003c/a>で適用開始月を指定してください。派遣担当者は育成担当者とは別です。\u003c/p>\u003c/fieldset>\u003cbutton>派遣情報を保存\u003c/button>\u003c/form>\u003cp id=\"dispatch-message\" role=\"alert\">\u003c/p>\u003cdetails>\u003csummary>派遣設定の適用履歴\u003c/summary>\u003cdiv id=\"dispatch-history\">\u003c/div>\u003c/details>\u003c/section>\u003cform class=\"ui-form\" id=\"employee-roles-form\" action=\"/api/admin/employees/roles\" method=\"patch\" enctype=\"application/x-www-form-urlencoded\">\n  \u003clabel class=\"field-label\" for=\"target_id\">権限を変更する社員番号\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"target_id\" value=\"\">\n  \u003clabel class=\"field-label\" for=\"roles\">新しい役割（読点で区切って複数指定できます）\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"roles\" value=\"\">\n  \u003cbutton class=\"submit-button\" type=\"submit\">権限を変更\u003c/button>\n\u003c/form>\n\n\u003cform class=\"ui-form\" id=\"employee-retire-form\" action=\"/api/admin/employees/retire\" method=\"patch\" enctype=\"application/x-www-form-urlencoded\">\n  \u003clabel class=\"field-label\" for=\"target_id\">退職処理する社員番号\u003c/label>\n  \u003cinput class=\"field-input\" type=\"text\" name=\"target_id\" value=\"\">\n  \u003cbutton class=\"submit-button\" type=\"submit\">退職処理\u003c/button>\n\u003c/form>\n\n\u003cp class=\"alert-region\" id=\"admin-alert\" role=\"alert\" aria-live=\"polite\">\n  必要事項を入力して操作してください。社員番号の重複、入力不備、自分の管理権限の解除や退職処理は受け付けません。\n\u003c/p>\n\n\n  \u003c/main>\n  \u003cfooter class=\"site-footer\">\n    \u003cp class=\"footer-note\">開発確認用の画面です。架空のデータを使用しています。\u003c/p>\n  \u003c/footer>\n\u003c/body>\n\u003c/html>", "/admin/security-reset": "\u003c!doctype html>\u003chtml lang=\"ja\">\u003cmeta charset=\"utf-8\">\n        \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>管理者による認証リセット | コスモライン\u003c/title>\n        \u003cstyle>:root{color-scheme:dark;--bg:#0b1428;--panel:#14233e;--line:#354968;--text:#edf3ff;--muted:#bfcee6;--blue:#234f91;--teal:#126458;--purple:#654494;--amber:#825314;--red:#9f394a}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,\"Yu Gothic\",sans-serif}\nmain,.site-main{width:100%;max-width:1120px;margin: ackground:#1e4b50;color:#e2fff8;border-left:3px solid #79d9c4;border-radius:4px;padding:4px;margin:5px 0;font-size:.8rem;line-height:1.5}.calendar-item.company{background:#34416b;border-color:#b0b6ff}.calendar-item.returned{background:#563346;border-color:#eeafc2}.shift-state{display:inline-block;font-size:.85rem;font-weight:700;border-radius:5px;padding:2px 7px;background:#234d56;color:#d5fff5}.shift-input-row{display:grid;grid-template-columns:110px 1fr 1fr 2fr;gap:10px;border-top:1px solid var(--line);padding:12px 0;align-items:center}.shift-input-row label{margin:0;font-size:.9rem}.shift-input-row input{padding:7px}.month-help{color:var(--muted)}details{margin:20px 0}summary{cursor:pointer;font-weight:700;color:#c9dcff}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem}.legend span{border-left:5px solid #7bdac5;padding-left:7px}.legend .company{border-color:#b0b6ff}\n@media(max-width:600px){main,.site-main{padding:14px}h1{font-size:1.5rem}nav{gap:7px}nav a{padding:8px 10px;font-size:.9rem}.menu-grid{grid-template-columns:1fr}.calendar{gap:3px}.calendar-day{padding:4px;min-height:105px;font-size:.85rem}.calendar-item{font-size:.65rem;padding:2px;border-left-width:2px}.shift-input-row{grid-template-columns:1fr 1fr}.shift-input-row strong,.shift-input-row label:last-child{grid-column:1/-1}section,article,form,.ui-form{padding:13px}input,select{width:100%}input[type=checkbox]{width:auto}.employee-row{display:block}.employee-cell{max-width:100%;overflow-wrap:anywhere}}\n\n.preset-choices{display:flex;flex-wrap:wrap;gap:8px}.preset-choice{background:#163d57}.preset-choice small{display:block;font-weight:400}.preset-choice[aria-pressed=true],#clear-shift-choice[aria-pressed=true]{outline:3px solid #ffe19c;background:#2b635f}.calendar-pick{display:block;width:100%;padding:2px;min-height:38px;background:#213e65;border:1px solid #6c8eb9}.calendar-pick[aria-pressed=true]{background:#226855;outline:2px solid #a2eed7}.calendar-draft{display:block;font-size:.75rem;background:#315045;color:#fff;overflow-wrap:anywhere}.calendar-pick:disabled{opacity:.6}.calendar-item{word-break:normal}nav a[href^=\"/suggestions\"]{background:#654494;border-color:#a48acb}\n@media(max-width:600px){.calendar-day{padding:2px}.calendar-item{padding:1px;font-size:.62rem}.calendar-pick{font-size:.8rem;padding:0}.calendar-draft{font-size:.62rem}}\n\n.global-nav{padding:12px 0;border-bottom:1px solid #354968;margin-bottom:24px}.global-nav a{font-size:.85rem;padding:7px 10px}.feature-group{background:transparent;border:0;padding:0;margin:26px 0}.feature-group h2{margin-bottom:10px}.feature-group .menu-grid{margin-top:0}\n\u003c/style>\u003cmain>\n        \u003cnav class=\"global-nav\" aria-label=\"全機能メニュー\">\u003ca href=\"/home\">ホーム\u003c/a>\u003ca href=\"/news\">会社のお知らせ\u003c/a>\u003ca href=\"/notifications\">個人宛通知\u003c/a>\u003ca href=\"/posts\">週報・学習の振り返り\u003c/a>\u003ca href=\"/schedule\">シフト・カレンダー\u003c/a>\u003ca href=\"/attendance\">勤怠・休暇\u003c/a>\u003ca href=\"/learning\">学習・ランキング\u003c/a>\u003ca href=\"/development\">育成・面談\u003c/a>\u003ca href=\"/suggestions\">目安箱\u003c/a>\u003ca href=\"/payroll\">勤怠集計・給与試算\u003c/a>\u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003ca href=\"/admin/audit\">操作履歴\u003c/a>\u003ca href=\"/settings\">基準・担当範囲\u003c/a>\u003ca href=\"/operations\">バックアップ・運用\u003c/a>\u003ca href=\"/security/totp\">二段階認証の設定\u003c/a>\u003c/nav>\n        \u003ch1>管理者による認証リセット\u003c/h1>\u003cp>パスワード・認証アプリ・復旧コード・パスキー・全端末のログインを失効させます。管理者自身も認証アプリ連携と再認証が必要です。自分自身のリセットは別の管理者に依頼してください。\u003c/p>\u003cp>\u003ca href=\"/security/totp\">管理者自身の認証アプリ設定\u003c/a>\u003c/p>\u003cp>本人確認は対面など社内で定めた方法で実施し、方法だけ記録してください。パスワードや認証コードを理由欄へ書かないでください。\u003c/p>\u003cform id=\"admin-security-reset\">\u003clabel>リセットする社員\u003cselect name=\"employee_id\" required>\u003coption value=\"\">選択してください\u003c/option>\u003c/select>\u003c/label>\u003clabel>リセット理由\u003cinput name=\"reason\" maxlength=\"300\" required>\u003c/label>\u003clabel>本人確認の方法\u003cinput name=\"verification\" maxlength=\"300\" placeholder=\"例：対面で社員本人を確認\" required>\u003c/label>\u003clabel>\u003cinput name=\"identity_confirmed\" type=\"checkbox\" required>本人確認を行いました\u003c/label>\u003clabel>管理者自身のパスワード\u003cinput name=\"password\" type=\"password\" autocomplete=\"current-password\" required>\u003c/label>\u003clabel>管理者の認証コード\u003cinput name=\"totp_code\" inputmode=\"numeric\" autocomplete=\"one-time-code\">\u003c/label>\u003cdetails>\u003csummary>復旧コードを使う\u003c/summary>\u003clabel>管理者の復旧コード\u003cinput name=\"recovery_code\" autocomplete=\"off\">\u003c/label>\u003c/details>\u003cbutton>認証情報をリセットして仮パスワードを発行\u003c/button>\u003c/form>\u003cp role=\"alert\" id=\"reset-message\">\u003c/p>\u003csection id=\"temporary-result\">\u003c/section>\u003cp>仮パスワードは有効期限２４時間・この画面で一度だけ表示します。本人への通知は管理側が別の安全な経路で行ってください。メールやSMSは自動送信しません。\u003c/p>\u003csection>\u003ch2>リセット履歴\u003c/h2>\u003c/section>\u003cdetails>\u003csummary>他の管理者へリセット権限を設定する\u003c/summary>\u003cp>この操作にも、上の管理者パスワードと認証コードを入力してください。通常の役割変更だけではリセット権限は付与されません。\u003c/p>\u003cform id=\"reset-permission-form\">\u003clabel>管理者\u003cselect name=\"employee_id\">\u003c/select>\u003c/label>\u003clabel>権限\u003cselect name=\"enabled\">\u003coption value=\"true\">付与\u003c/option>\u003coption value=\"false\">解除\u003c/option>\u003c/select>\u003c/label>\u003cbutton>リセット権限を更新\u003c/button>\u003c/form>\u003c/details>\u003c/main>\u003c/html>", "/attendance": "\u003c!doctype html>\u003chtml lang=\"ja\">\u003cmeta charset=\"utf-8\">\n        \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>勤怠・休暇・申請 | コスモライン\u003c/title>\n        \u003cstyle>:root{color-scheme:dark;--bg:#0b1428;--panel:#14233e;--line:#354968;--text:#edf3ff;--muted:#bfcee6;--blue:#234f91;--teal:#126458;--purple:#654494;--amber:#825314;--red:#9f394a}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,\"Yu Gothic\",sans-serif}\nmain,.site-main{width:100%;max-width:1120px;margin:auto;padding:24px}h ing:1px;font-size:.62rem}.calendar-pick{font-size:.8rem;padding:0}.calendar-draft{font-size:.62rem}}\n\n.global-nav{padding:12px 0;border-bottom:1px solid #354968;margin-bottom:24px}.global-nav a{font-size:.85rem;padding:7px 10px}.feature-group{background:transparent;border:0;padding:0;margin:26px 0}.feature-group h2{margin-bottom:10px}.feature-group .menu-grid{margin-top:0}\n\u003c/style>\u003cmain>\n        \u003cnav class=\"global-nav\" aria-label=\"全機能メニュー\">\u003ca href=\"/home\">ホーム\u003c/a>\u003ca href=\"/news\">会社のお知らせ\u003c/a>\u003ca href=\"/notifications\">個人宛通知\u003c/a>\u003ca href=\"/posts\">週報・学習の振り返り\u003c/a>\u003ca href=\"/schedule\">シフト・カレンダー\u003c/a>\u003ca href=\"/attendance\">勤怠・休暇\u003c/a>\u003ca href=\"/learning\">学習・ランキング\u003c/a>\u003ca href=\"/development\">育成・面談\u003c/a>\u003ca href=\"/suggestions\">目安箱\u003c/a>\u003ca href=\"/payroll\">勤怠集計・給与試算\u003c/a>\u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003ca href=\"/admin/audit\">操作履歴\u003c/a>\u003ca href=\"/settings\">基準・担当範囲\u003c/a>\u003ca href=\"/operations\">バックアップ・運用\u003c/a>\u003ca href=\"/security/totp\">二段階認証の設定\u003c/a>\u003c/nav>\n        \u003ch1>会社別共有・勤怠締め\u003c/h1>\u003cp>派遣先会社と締日が属する対象月を選びます。勤務時間は実経過時間で、休憩控除や法定労働時間・有休時間の計算は行いません。有休・公休は承認済みの区分と日付だけを含めます。給与・評価・目安箱・認証情報は出力しません。\u003c/p>\u003cp>勤怠は対象期間終了後に「勤怠を締める」を実行したものだけ出せます。未退勤・未処理申請がある場合は締められません。締め後の修正は再締めして新しい版を作ります。同じデータのCSVとコピーには同じ版を使います。\u003c/p>\u003cform id=\"company-sharing-form\">\u003clabel>派遣先会社\u003cselect name=\"company_id\" required>\u003coption value=\"\">会社を選択\u003c/option>\u003c/select>\u003c/label>\u003clabel>対象月（締日が属する月）\u003cinput type=\"month\" name=\"period\" value=\"2026-10\" required>\u003c/label>\u003clabel>出力区分\u003cselect name=\"kind\">\u003coption value=\"shifts\">確定シフト\u003c/option>\u003coption value=\"attendance\">締め済み勤怠実績（出退勤・有休・公休）\u003c/option>\u003c/select>\u003c/label>\u003cbutton type=\"submit\">対象期間と内容を確認\u003c/button>\u003cbutton type=\"button\" id=\"company-close\">勤怠を締める・再締め\u003c/button>\u003cbutton type=\"button\" id=\"company-csv\">CSVを出力\u003c/button>\u003cbutton type=\"button\" id=\"company-copy\">スプシ用にコピー\u003c/button>\u003c/form>\u003cp id=\"company-sharing-message\" role=\"alert\">\u003c/p>\u003csection id=\"company-preview\">\u003c/section>\u003clabel>貼り付け用データ\u003ctextarea id=\"company-tsv\" readonly rows=\"8\">\u003c/textarea>\u003c/label>\u003cp>コピーに対応しないブラウザーでは上の欄を選択して手動でコピーできます。貼り付け先と会社・期間・版を確認してください。会社ごとに共有ファイルを分けてください。\u003c/p>\u003cp>\u003ca href=\"/dispatch/companies\">派遣先会社・締日設定\u003c/a> / \u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003c/p>\u003c/main>\u003c/html>", "/dashboard": "\u003c!doctype html>\u003chtml lang=\"ja\">\u003cmeta charset=\"utf-8\">\n        \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>管理ダッシュボード | コスモライン\u003c/title>\n        \u003cstyle>:root{color-scheme:dark;--bg:#0b1428;--panel:#14233e;--line:#354968;--text:#edf3ff;--muted:#bfcee6;--blue:#234f91;--teal:#126458;--purple:#654494;--amber:#825314;--red:#9f394a}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,\"Yu Gothic\",sans-serif}\nmain,.site-main{width:100%;max-width:1120px;margin:auto;padding:24px}header.site-header,footer.site-footer{background:#101e35;color:var(--muted);padding:16px 24px;border:0}\n.site-title{font-size:1.2rem;color:var(--text);font-weight:700;margin:0}.footer-note{color:var(--muted)}h1{font-size:1.8rem;line-height:1.4}h2{font-size:1.3rem}h3{font-size:1.05rem}p,td,article{overflow-wrap:anywhere}\na{color:#b9d6ff;text-decoration:underline;text-underline-offset:3px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}nav a,.ui-action-item{display:inline-block;background:var(--blue);color:#fff;border:1px solid #6488bd;border-radius:10px;padding:10px 16px;text-decoration:none;font-weight:700;margin:0}\nnav a[href^=\"/schedule\"],nav a[href^=\"/attendance\"]{background:var(--teal);border-color:#58a599}\nnav a[href^=\"/learning\"],nav a[href らせ\u003c/a>\u003ca href=\"/notifications\">個人宛通知\u003c/a>\u003ca href=\"/posts\">週報・学習の振り返り\u003c/a>\u003ca href=\"/schedule\">シフト・カレンダー\u003c/a>\u003ca href=\"/attendance\">勤怠・休暇\u003c/a>\u003ca href=\"/learning\">学習・ランキング\u003c/a>\u003ca href=\"/development\">育成・面談\u003c/a>\u003ca href=\"/suggestions\">目安箱\u003c/a>\u003ca href=\"/payroll\">勤怠集計・給与試算\u003c/a>\u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003ca href=\"/admin/audit\">操作履歴\u003c/a>\u003ca href=\"/settings\">基準・担当範囲\u003c/a>\u003ca href=\"/operations\">バックアップ・運用\u003c/a>\u003ca href=\"/security/totp\">二段階認証の設定\u003c/a>\u003c/nav>\n        \u003ch1>管理ダッシュボード\u003c/h1>\u003cp>２列×４段の８区画です。表示するカード・位置・サイズを選んで保存できます。配置はログイン中のIDだけに保存されます。\u003c/p>\u003cp>本日の予定は日本時間です。稼働予定は確定シフト、面談は予約済みの育成面談です。採用面接・取引先の管理機能はまだありません。\u003c/p>\u003cdiv id=\"dashboard-grid\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\u003csection class=\"dashboard-card\" data-card=\"workers\" data-slot=\"1\" data-span=\"1\" style=\"grid-row:1;grid-column:1 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>本日の稼働予定者\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/schedule\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"meetings\" data-slot=\"2\" data-span=\"1\" style=\"grid-row:1;grid-column:2 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>本日の面談予定\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/development\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"unclosed\" data-slot=\"3\" data-span=\"1\" style=\"grid-row:2;grid-column:1 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>勤怠の確認が必要\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/attendance\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"requests\" data-slot=\"4\" data-span=\"1\" style=\"grid-row:2;grid-column:2 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>確認待ちの申請\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/attendance\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"shifts\" data-slot=\"5\" data-span=\"1\" style=\"grid-row:3;grid-column:1 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>登録済みのシフト\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/schedule\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"news\" data-slot=\"6\" data-span=\"1\" style=\"grid-row:3;grid-column:2 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>会社のお知らせ\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/news\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"notices\" data-slot=\"7\" data-span=\"1\" style=\"grid-row:4;grid-column:1 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>自分宛の通知\u003c/h2>\u003cp>該当する情報はありません\u003c/p>\u003ca href=\"/notifications\">詳細を開く\u003c/a>\u003c/section>\u003csection class=\"dashboard-card\" data-card=\"employees\" data-slot=\"8\" data-span=\"1\" style=\"grid-row:4;grid-column:2 / span 1;min-width:0;overflow-wrap:anywhere\">\u003ch2>在籍社員\u003c/h2>\u003cp>1人在籍\u003c/p>\u003ca href=\"/admin/employees\">詳細を開く\u003c/a>\u003c/section>\u003c/div>\u003cdetails id=\"dashboard-editor\">\u003csummary>ダッシュボードを編集\u003c/summary>\u003cp>２区画サイズは横幅いっぱいです。隣のカードを非表示にしてから設定してください。保存前の変更は画面に反映されません。\u003c/p>\u003cform id=\"dashboard-layout-form\">\u003cfieldset data-card=\"workers\">\u003clegend>本日の稼働予定者\u003c/legend>\u003clabel>表示する\u003cinput type=\"checkbox\" name=\"enabled\" checked>\u003c/label>\u003clabel>配置区画\u003cselect name=\"slot\">\u003coption value=\"1\" selected>1（左・1段目）\u003c/option>\u003coption value=\"2\">2（右・1段目）\u003c/option>\u003coption value=\"3\">3（左・2段目）\u003c/option>\u003coption value=\"4\">4（右・2段目）\u003c/option>\u003coption value=\"5\">5（左・3段目）\u003c/option>\u003coption value=\"6\">6（右・3段目）\u003c/option>\u003coption value=\"7\">7（左・4段目）\u003c/option>\u003coption value=\"8\">8（右・4段目）\u003c/option>\u003c/select>\u003c/label>\u003clabel>サ 003ch2>育成状況\u003c/h2>\u003cp>育成担当者：未設定\u003c/p>\u003cp>\u003ca href=\"/admin/employees\">社員登録・育成設定の変更\u003c/a>\u003c/p>\u003cp>未登録\u003c/p>\u003c/section>\u003cp>企画上の初期持ち点案は短期6・標準10・長期20です。減点制は再検討中で、ここでは得点や処遇を自動算定しません。\u003c/p>\u003cform method=\"get\">\u003clabel>担当社員の記録を見る\u003cinput name=\"member_id\" required>\u003c/label>\u003cbutton>表示\u003c/button>\u003c/form>\n            \u003cform method=\"post\" action=\"/api/development\">\u003ch2>担当社員の育成記録\u003c/h2>\u003clabel>社員番号\u003cinput name=\"member_id\" required>\u003c/label>\n            \u003clabel>コース\u003cselect name=\"course\">\u003coption value=\"intensive\">短期集中（企画案3〜6か月）\u003c/option>\u003coption value=\"standard\">標準（企画案6か月〜1年）\u003c/option>\u003coption value=\"long\">長期（企画案1〜2年）\u003c/option>\u003c/select>\u003c/label>\n            \u003clabel>ポジション\u003cselect name=\"position\">\u003coption>人事企画\u003c/option>\u003coption>人事メンター\u003c/option>\u003coption>人事採用\u003c/option>\u003coption>人事事務\u003c/option>\u003c/select>\u003c/label>\n            \u003clabel>進捗 %\u003cinput name=\"progress\" type=\"number\" min=\"0\" max=\"100\" required>\u003c/label>\u003clabel>記録\u003ctextarea name=\"notes\" required>\u003c/textarea>\u003c/label>\u003cbutton>育成を保存\u003c/button>\u003c/form>\n            \u003cform method=\"post\" action=\"/api/interview-slots\">\u003ch2>面談の空き枠\u003c/h2>\u003clabel>開始（時差付き日時・例：２０２６年１０月２４日の午前９時は 2026-10-24T09:00:00+09:00）\u003cinput name=\"start_at\" required>\u003c/label>\n            \u003clabel>終了\u003cinput name=\"end_at\" required>\u003c/label>\u003cbutton>空き枠を登録\u003c/button>\u003c/form>\n            \u003cform method=\"post\" action=\"/api/interviews\">\u003clabel>担当社員番号\u003cinput name=\"member_id\" required>\u003c/label>\u003clabel>面談記録\u003ctextarea name=\"notes\" required>\u003c/textarea>\u003c/label>\u003cbutton>面談を保存\u003c/button>\u003c/form>\u003cform method=\"post\" action=\"/api/development/evaluations\">\u003ch2>能力・成果の観察記録\u003c/h2>\u003clabel>担当社員番号\u003cinput name=\"membe endar-day strong{display:block}.calendar-day.sunday strong{color:#ffb4c6}.calendar-day.saturday strong{color:#a3caff}.calendar-item{display:block;background:#1e4b50;color:#e2fff8;border-left:3px solid #79d9c4;border-radius:4px;padding:4px;margin:5px 0;font-size:.8rem;line-height:1.5}.calendar-item.company{background:#34416b;border-color:#b0b6ff}.calendar-item.returned{background:#563346;border-color:#eeafc2}.shift-state{display:inline-block;font-size:.85rem;font-weight:700;border-radius:5px;padding:2px 7px;background:#234d56;color:#d5fff5}.shift-input-row{display:grid;grid-template-columns:110px 1fr 1fr 2fr;gap:10px;border-top:1px solid var(--line);padding:12px 0;align-items:center}.shift-input-row label{margin:0;font-size:.9rem}.shift-input-row input{padding:7px}.month-help{color:var(--muted)}details{margin:20px 0}summary{cursor:pointer;font-weight:700;color:#c9dcff}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem}.legend span{border-left:5px solid #7bdac5;padding-left:7px}.legend .company{border-color:#b0b6ff}\n@media(max-width:600px){main,.site-main{padding:14px}h1{font-size:1.5rem}nav{gap:7px}nav a{padding:8px 10px;font-size:.9rem}.menu-grid{grid-template-columns:1fr}.calendar{gap:3px}.calendar-day{padding:4px;min-height:105px;font-size:.85rem}.calendar-item{font-size:.65rem;padding:2px;border-left-width:2px}.shift-input-row{grid-template-columns:1fr 1fr}.shift-input-row strong,.shift-input-row label:last-child{grid-column:1/-1}section,article,form,.ui-form{padding:13px}input,select{width:100%}input[type=checkbox]{width:auto}.employee-row{display:block}.employee-cell{max-width:100%;overflow-wrap:anywhere}}\n\n.preset-choices{display:flex;flex-wrap:wrap;gap:8px}.preset-choice{background:#163d57}.preset-choice small{display:block;font-weight:400}.preset-choice[aria-pressed=true],#clear-shift-choice[aria-pressed=true]{outline:3px solid #ffe19c;background:#2b635f}.calendar-pick{display:block;width:100%;padding:2px;min-height:38px;background:#213e65;border:1px solid #6c8eb9}.calendar-pick[aria-pressed=true]{background:#226855;outline:2px solid #a2eed7}.calendar-draft{display:block;font-size:.75rem;background:#315045;color:#fff;overflow-wrap:anywhere}.calendar-pick:disabled{opacity:.6}.calendar-item{word-break:normal}nav a[href^=\"/suggestions\"]{background:#654494;border-color:#a48acb}\n@media(max-width:600px){.calendar-day{padding:2px}.calendar-item{padding:1px;font-size:.62rem}.calendar-pick{font-size:.8rem;padding:0}.calendar-draft{font-size:.62rem}}\n\n.global-nav{padding:12px 0;border-bottom:1px solid #354968;margin-bottom:24px}.global-nav a{font-size:.85rem;padding:7px 10px}.feature-group{background:transparent;border:0;padding:0;margin:26px 0}.feature-group h2{margin-bottom:10px}.feature-group .menu-grid{margin-top:0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"site-header\">\n    \u003cp class=\"site-title\">コスモライン｜社員ポータル\u003c/p>\n  \u003c/header>\n  \u003cmain class=\"site-main\">\n    \u003cnav class=\"global-nav\" aria-label=\"全機能メニュー\">\u003ca href=\"/home\">ホーム\u003c/a>\u003ca href=\"/news\">会社のお知らせ\u003c/a>\u003ca href=\"/notifications\">個人宛通知\u003c/a>\u003ca href=\"/posts\">週報・学習の振り返り\u003c/a>\u003ca href=\"/schedule\">シフト・カレンダー\u003c/a>\u003ca href=\"/attendance\">勤怠・休暇\u003c/a>\u003ca href=\"/learning\">学習・ランキング\u003c/a>\u003ca href=\"/development\">育成・面談\u003c/a>\u003ca href=\"/suggestions\">目安箱\u003c/a>\u003ca href=\"/payroll\">勤怠集計・給与試算\u003c/a>\u003ca href=\"/admin/employees\">社員管理\u003c/a>\u003ca href=\"/admin/audit\">操作履歴\u003c/a>\u003ca href=\"/settings\">基準・担当範囲\u003c/a>\u003ca href=\"/operations\">バックアップ・運用\u003c/a>\u003ca href=\"/security/totp\">二段階認証の設定\u003c/a>\u003c/nav>\n    \n\u003ch1 class=\"page-heading\">ホーム\u003c/h1>\u003cp>\u003ca class=\"submit-button\" href=\"/dashboard\">管理ダッシュボードを開く\u003c/a>\u003c/p>\u003cp>今日の確認と、よく使う手続きをここから始められます。\u003c/p>\n\n\u003csection>\u003ch2>本日の確認\u003c/h2>\n  \u003cp>登録シフト 0 件 / 処理待ち申請 0 件\u003c/p>\n  \u003cp>次の面談：予約なし\u003c/   \u003ch1>シフト・カレンダー・通知\u003c/h1>\u003csection>\u003ch2>月ごとのシフト・予定\u003c/h2>\u003cp>日本時間で表示します。確定したシフトを登録・共有します。\u003c/p>\u003cform method=\"get\" class=\"month-toolbar\">\u003clabel>表示する月\u003cinput type=\"month\" name=\"month\" value=\"2026-10\" required>\u003c/label>\u003cbutton>この月を表示\u003c/button>\u003c/form>\u003cnav aria-label=\"月の切替\">\u003ca href=\"/schedule?month=2026-09\">前の月\u003c/a>\u003cstrong>2026年10月\u003c/strong>\u003ca href=\"/schedule?month=2026-11\">次の月\u003c/a>\u003c/nav>\u003csection id=\"shift-preset-controls\">\u003ch2>プリセットでまとめて登録\u003c/h2>\u003cp>①勤務時間を選ぶ → ②カレンダーの日付をタップ → ③まとめて保存。日付のタップだけではまだ送信しません。\u003c/p>\u003cdiv class=\"preset-choices\" role=\"group\" aria-label=\"勤務時間のプリセット\">\u003cbutton type=\"button\" id=\"clear-shift-choice\" aria-pressed=\"false\">選択を取り消す\u003c/button>\u003c/div>\u003cp id=\"shift-selection-help\" aria-live=\"polite\">プリセットを選んでください。\u003c/p>\u003cp id=\"shift-selection-count\">選択中：0日\u003c/p>\u003cbutton type=\"submit\" form=\"monthly-shift-form\" id=\"save-calendar-shifts\">選んだシフトをまとめて保存\u003c/button>\u003cp>プリセットがまだありません。下の「プリセットを登録」から作成してください。\u003c/p>\u003cdetails id=\"preset-library\">\u003csummary>プリセットを登録・管理\u003c/summary>\u003cform action=\"/api/shift-presets\" method=\"post\" id=\"shift-preset-form\">\u003clabel>名前（例：早番）\u003cinput name=\"name\" maxlength=\"60\" required>\u003c/label>\u003clabel>開始\u003cinput type=\"time\" name=\"start\" required>\u003c/label>\u003clabel>終了\u003cinput type=\"time\" name=\"end\" required>\u003c/label>\u003clabel>メモ（任意）\u003cinput name=\"note\" maxlength=\"4000\">\u003c/label>\u003cbutton>プリセットを登録\u003c/button>\u003c/form>\u003c/details>\u003c/section>\u003cdiv class=\"legend\">\u003cspan>自分のシフト\u003c/span>\u003cspan class=\"company\">社内行事・面談・期限\u003c/span>\u003c/div>\u003cdiv class=\"calendar\" role=\"group\" aria-label=\"月間カレンダー\">\u003cdiv class=\"calendar-weekday\">月\u003c/div>\u003cdiv class=\"calendar-weekday\">火\u003c/div>\u003cdiv class=\"calendar-weekday\">水\u003c/div>\u003cdiv class=\"calendar-weekday\">木\u003c/div>\u003cdiv class=\"calendar-weekday\">金\u003c/div>\u003cdiv class=\"calendar-weekday\">土\u003c/div>\u003cdiv class=\"calendar-weekday\">日\u003c/div>\u003cdiv class=\"calendar-day empty\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"calendar-day empty\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"calendar-day empty\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-01\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"1\" aria-label=\"1日にシフトを割り当て\" aria-pressed=\"false\" >1日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"1\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-02\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"2\" aria-label=\"2日にシフトを割り当て\" aria-pressed=\"false\" >2日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"2\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day saturday\" data-date=\"2026-10-03\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"3\" aria-label=\"3日にシフトを割り当て\" aria-pressed=\"false\" >3日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"3\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day sunday\" data-date=\"2026-10-04\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"4\" aria-label=\"4日にシフトを割り当て\" aria-pressed=\"false\" >4日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"4\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-05\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"5\" aria-label=\"5日にシフトを割り当て\" aria-pressed=\"false\" >5日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"5\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-06\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"6\" aria-label=\"6日にシフトを割り当て\" aria-pressed=\"false\" >6日\u003c/button>\u003cs 003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-14\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"14\" aria-label=\"14日にシフトを割り当て\" aria-pressed=\"false\" >14日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"14\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-15\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"15\" aria-label=\"15日にシフトを割り当て\" aria-pressed=\"false\" >15日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"15\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-16\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"16\" aria-label=\"16日にシフトを割り当て\" aria-pressed=\"false\" >16日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"16\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day saturday\" data-date=\"2026-10-17\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"17\" aria-label=\"17日にシフトを割り当て\" aria-pressed=\"false\" >17日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"17\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day sunday\" data-date=\"2026-10-18\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"18\" aria-label=\"18日にシフトを割り当て\" aria-pressed=\"false\" >18日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"18\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-19\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"19\" aria-label=\"19日にシフトを割り当て\" aria-pressed=\"false\" >19日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"19\">\u003c/span>\u003c/div>\u003cdiv class=\"calendar-day \" data-date=\"2026-10-20\">\u003cbutton type=\"button\" class=\"calendar-pick\" data-day=\"20\" aria-label=\"20日にシフトを割り当て\" aria-pressed=\"false\" >20日\u003c/button>\u003cspan class=\"calendar-draft\" data-draft-day=\"20\">\u003c/span>\u003c/div>\u003cdiv class=\"c const pages=JSON.parse(document.getElementById('data').textContent),screen=document.getElementById('screen'),select=document.getElementById('pages');
const titles={};for(const [path,source] of Object.entries(pages)){const d=new DOMParser().parseFromString(source,'text/html');titles[path]=d.querySelector('h1')?.textContent||d.title||path;const o=document.createElement('option');o.value=path;o.textContent=titles[path]+'　'+path;select.append(o)}

function show(path){if(!pages[path]){toast();return}const d=new DOMParser().parseFromString(pages[path],'text/html');d.querySelectorAll('script,iframe,object,embed,link,meta,base').forEach(x=>x.remove());d.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes])if(a.name.startsWith('on'))el.removeAttribute(a.name)});screen.innerHTML='';d.querySelectorAll('style').forEach(x=>screen.append(x.cloneNode(true)));screen.append(...d.body.childNodes);select.value=path;screen.querySelectorAll('form').forEach(f=>{f.removeAttribute('action');f.noValidate=true;f.addEventListener('submit',e=>{e.preventDefault();path==='/login'?show('/home'):toast()})});screen.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const url=new URL(a.getAttribute('href')||'','http://preview.invalid');pages[url.pathname]?show(url.pathname):toast()}));screen.querySelectorAll('button').forEach(b=>{if(b.type==='button')b.addEventListener('click',toast)});window.scrollTo(0,0)}
